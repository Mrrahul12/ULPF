[pytest]
# Pytest configuration for ULPF

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for organizing tests
markers =
    detector: Source detection tests
    parser: Parser tests
    normalizer: Normalization tests
    validator: Validation tests
    pipeline: Pipeline integration tests
    api: API endpoint tests
    registry: Parser registry tests
    slow: Slow tests
    integration: Integration tests
