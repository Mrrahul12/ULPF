apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ulpf
  namespace: ulpf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ulpf
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
