apiVersion: apps/v1
kind: Deployment
metadata:
  name: ulpf
  namespace: ulpf
  labels:
    app.kubernetes.io/name: ulpf
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ulpf
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ulpf
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ulpf
          image: ulpf:step10.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ulpf-config
          env:
            - name: ULPF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ulpf-secrets
                  key: ULPF_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
