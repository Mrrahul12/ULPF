services:
  ulpf:
    build:
      context: .
      dockerfile: Dockerfile
    image: ulpf:step9
    environment:
      ULPF_API_KEY: ${ULPF_API_KEY:-}
      ULPF_RATE_LIMIT: ${ULPF_RATE_LIMIT:-100}
      ULPF_RATE_WINDOW_SECONDS: ${ULPF_RATE_WINDOW_SECONDS:-60}
      ULPF_LOG_LEVEL: ${ULPF_LOG_LEVEL:-INFO}
      ULPF_OTEL_ENABLED: ${ULPF_OTEL_ENABLED:-true}
      ULPF_OTEL_CONSOLE_EXPORT: ${ULPF_OTEL_CONSOLE_EXPORT:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ulpf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${ULPF_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      ulpf:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
